[package]
name = "cuda-core"
description = "Idiomatic CUDA API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
cuda-bindings = { workspace = true }
anyhow = { workspace = true }
half = { workspace = true }
# Used by the vendored artifact-bundle reader in `simt::artifacts`.
object = { version = "0.36", default-features = false, features = ["read", "std", "write"] }

[dev-dependencies]
trybuild = "1"

[features]
# Nightly-only: DeviceCopy for the unstable f16 primitive.
f16 = []
